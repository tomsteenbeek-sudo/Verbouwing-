<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Verbouwplan Leliestraat 27</title>
<meta name="description" content="Verbouw-app: dashboard met de eerstvolgende klusdag, voortgang, acties en waarschuwingen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div id="app-nav"></div>

<header class="page-header">
  <div class="wrap">
    <div>
      <div class="eyebrow">Verbouwplan Leliestraat 27</div>
      <h1>Dashboard</h1>
      <p>Een compact overzicht: wat vandaag telt, wat nog open staat en waar je op moet letten.</p>
    </div>
  </div>
</header>

<main class="wrap" style="padding:36px 20px;" id="dash-root">
  <div class="two-col" style="margin-bottom:28px;align-items:start;">
    <div class="card pad" id="next-workday">
      <div class="loading-state">Laden…</div>
    </div>
    <div>
      <div class="dashboard-grid" style="margin-bottom:0;">
        <div class="card dashboard-tile" id="stat-voortgang"></div>
        <div class="card dashboard-tile" id="stat-besluiten"></div>
        <div class="card dashboard-tile" id="stat-offertes"></div>
        <div class="card dashboard-tile" id="stat-materialen"></div>
      </div>
    </div>
  </div>

  <section class="section" style="padding-top:0;">
    <h3 style="font-size:1rem;margin-bottom:12px;">Budget</h3>
    <div id="dash-budget" class="card pad"><div class="loading-state">Laden…</div></div>
  </section>

  <section id="dash-warnings-section" class="section" style="padding-top:0;">
    <h3 style="font-size:1rem;margin-bottom:12px;">Waarschuwingen</h3>
    <ul class="warning-list" id="dash-warnings"></ul>
  </section>

  <section class="section" style="padding-top:0;">
    <h3 style="font-size:1rem;margin-bottom:12px;">Komende werkzaamheden</h3>
    <div id="upcoming-tasks"><div class="loading-state">Laden…</div></div>
  </section>
</main>

<footer>
  <div class="wrap">Verbouwplan Leliestraat 27 · werkdocument · <span id="year"></span></div>
</footer>

<script type="module" src="js/pages/dashboard.js?v=3"></script>
</body>
</html>
